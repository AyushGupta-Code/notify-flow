# Local stack. `docker compose up --build` starts everything with the mock LLM.
# `docker compose --profile aws up` adds LocalStack for the SQS / Step Functions adapters.
x-app: &app
  build: .
  image: notify-flow:local
  restart: on-failure
  environment: &app-env
    NF_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/notify_flow
    NF_KAFKA_BOOTSTRAP: kafka:9092
    NF_TEMPORAL_ADDRESS: temporal:7233
    NF_LLM_PROVIDER: ${NF_LLM_PROVIDER:-mock}
    NF_LLM_MODEL: ${NF_LLM_MODEL:-mock-copywriter-1}
    NF_LLM_BASE_URL: ${NF_LLM_BASE_URL:-http://host.docker.internal:11434}
    NF_ENGAGEMENT_WAIT_S: ${NF_ENGAGEMENT_WAIT_S:-172800}
    NF_QUIET_HOURS_ENABLED: ${NF_QUIET_HOURS_ENABLED:-true}
    NF_API_BEARER_TOKEN: ${NF_API_BEARER_TOKEN:-local-dev-token}
  depends_on:
    migrate: {condition: service_completed_successfully}

services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: notify_flow}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health | grep -q SERVING"]
      interval: 5s
      retries: 40

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment: {TEMPORAL_ADDRESS: temporal:7233}
    ports: ["8080:8080"]
    depends_on: [temporal]

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *app
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      retries: 20

  relay:
    <<: *app
    command: ["python", "-m", "notify_flow.relay_main"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}

  consumer:
    <<: *app
    command: ["python", "-m", "notify_flow.consumer"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
      temporal: {condition: service_healthy}

  worker:
    <<: *app
    command: ["python", "-m", "notify_flow.worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  localstack:
    profiles: ["aws"]
    image: localstack/localstack:3.8
    environment: {SERVICES: "sqs,stepfunctions,iam"}
    ports: ["4566:4566"]
