# Prompt and template registry. Bump a version instead of editing one in place:
# every sent notification records prompt_version, llm_model and template_version.
registry_version: "2026-11-23.1"

channel_limits:   # max rendered characters
  sms: 160
  push: 120
  email: 600

banned_phrases:   # tone and scope rules shared by the runtime guardrail and the eval
  - "you failed"
  - "lazy"
  - "disappointed"
  - "guarantee"
  - "cure"
  - "diagnos"
  - "prescri"
  - "medication"
  - "act now"
  - "last chance"

campaigns:
  welcome:
    llm_allowed: true
    active_prompt: welcome-v1
    template_version: tmpl-welcome-v1
    prompts:
      welcome-v1:
        context_fields: [program_week]
        instructions: |
          You write short, warm notifications for a digital physical-therapy program.
          Write one welcome message for a new member. Use the literal placeholder {first_name}
          exactly once for the member's name. No medical advice, no promises of outcomes,
          at most one exclamation mark, and stay under max_chars characters.
          For email, end with a sentence saying how to opt out. Return only the message.
    templates:
      default: "Hi {first_name}, welcome to the program. Your first short exercise session is ready in the app."
      email: "Hi {first_name}, welcome to the program. Your first short exercise session is ready in the app. You can adjust or opt out of reminders in the app settings."

  reengage:
    llm_allowed: true
    active_prompt: reengage-v2
    template_version: tmpl-reengage-v1
    prompts:
      reengage-v1:
        context_fields: [days_since_last_session]
        instructions: |
          Write a short reminder to resume exercises. Use {first_name} once. Return only the message.
      reengage-v2:
        context_fields: [days_since_last_session, program_week]
        instructions: |
          You write short, encouraging notifications for a digital physical-therapy program.
          The member has not done an exercise session recently. Invite them back without guilt
          or blame. Use the literal placeholder {first_name} exactly once for the member's name.
          No medical advice, no promises of outcomes, at most one exclamation mark, and stay
          under max_chars characters. For email, end with a sentence saying how to opt out.
          Return only the message.
    templates:
      default: "Hi {first_name}, your exercises are ready whenever you are. A short session today still counts."
      email: "Hi {first_name}, your exercises are ready whenever you are. A short session today still counts. You can adjust or opt out of reminders in the app settings."

  milestone:
    llm_allowed: true
    active_prompt: milestone-v1
    template_version: tmpl-milestone-v1
    prompts:
      milestone-v1:
        context_fields: [session_count]
        instructions: |
          Congratulate the member on reaching session_count exercise sessions. Use the literal
          placeholder {first_name} exactly once. No medical claims, at most one exclamation mark,
          stay under max_chars characters. For email, end with a sentence saying how to opt out.
          Return only the message.
    templates:
      default: "Nice work, {first_name}. You've completed {session_count} sessions."
      email: "Nice work, {first_name}. You've completed {session_count} sessions. You can adjust or opt out of reminders in the app settings."

  pain_checkin:
    # Clinically sensitive: never generated by a model. Reviewed template only.
    llm_allowed: false
    active_prompt: null
    template_version: tmpl-pain-checkin-v1
    templates:
      default: "Hi {first_name}, thanks for telling us how you feel. Your care team will reach out within one business day."
      email: "Hi {first_name}, thanks for telling us how you feel. Your care team will reach out within one business day. You can adjust or opt out of reminders in the app settings."
