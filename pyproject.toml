[project]
name = "notify-flow"
version = "0.1.0"
description = "Event-driven member-notification service for a fictional digital MSK care program"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "aiokafka>=0.11",
  "temporalio>=1.8",
  "httpx>=0.27",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "scikit-learn>=1.5",
  "moto[server,sqs,stepfunctions]>=5.0",
  "boto3-stubs[sqs,stepfunctions]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notify_flow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: needs Postgres (NF_DATABASE_URL) and downloads the Temporal test server",
  "kafka: needs a reachable Kafka broker (NF_KAFKA_BOOTSTRAP)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/**" = ["S"]
"evals/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["src"]
