name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.12 && uv pip install -e '.[dev]'
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: notify_flow_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
      kafka:
        image: apache/kafka:3.9.0
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-retries 30
    env:
      NF_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/notify_flow_test
      NF_KAFKA_BOOTSTRAP: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.12 && uv pip install -e '.[dev]'
      - name: unit + integration tests (Postgres, Kafka, Temporal test server, moto)
        run: .venv/bin/pytest -v -rs --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: pytest-results, path: pytest.xml}

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.12 && uv pip install -e '.[dev]'
      - run: .venv/bin/python -m evals.run_eval --provider mock --min-pass-rate 0.95 --out eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: eval-report, path: eval-report.json}

  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config + unit-test alert rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus" -w /etc/prometheus \
            --entrypoint promtool prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus" -w /etc/prometheus \
            --entrypoint promtool prom/prometheus:v2.55.1 test rules alerts_test.yml alerts_drill_test.yml
      - name: dashboard JSON is current
        run: |
          python3 scripts/build_dashboard.py
          git diff --exit-code deploy/grafana/dashboards/

  compose-smoke:
    needs: [lint, test]
    runs-on: ubuntu-latest
    env:
      NF_ENGAGEMENT_WAIT_S: "5"
      NF_QUIET_HOURS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 300 api worker consumer relay prometheus grafana
      - run: pip install httpx
      - run: python3 scripts/smoke_test.py --api http://localhost:8000 --expect-escalation --timeout 180
      - name: prometheus scraped every component
        run: |
          sleep 10
          curl -s 'http://localhost:9090/api/v1/query?query=up' | python3 -c "
          import json,sys; r=json.load(sys.stdin)['data']['result']
          up={x['metric']['component']:x['value'][1] for x in r}; print(up)
          assert set(up)=={'api','relay','consumer','worker'} and all(v=='1' for v in up.values())"
      - name: grafana provisioned the dashboard
        run: curl -sf http://localhost:3000/api/dashboards/uid/notify-flow | python3 -c "import json,sys; d=json.load(sys.stdin)['dashboard']; print(d['title'], len(d['panels']), 'panels')"
      - if: failure()
        run: docker compose logs --no-color | tail -300
      - if: always()
        run: docker compose down -v

  kind:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: {cluster_name: nf}
      - run: docker build -t notify-flow:ci .
      - run: kind load docker-image notify-flow:ci --name nf
      - run: kubectl apply -k deploy/k8s/overlays/kind
      - name: wait for dependencies, migration and rollouts
        run: |
          kubectl -n notify-flow rollout status deploy/postgres --timeout=180s
          kubectl -n notify-flow rollout status deploy/kafka --timeout=180s
          kubectl -n notify-flow rollout status deploy/temporal --timeout=300s
          kubectl -n notify-flow wait --for=condition=complete job/notify-flow-migrate --timeout=300s
          for d in api relay consumer worker; do
            kubectl -n notify-flow rollout status deploy/notify-flow-$d --timeout=300s
          done
      - run: pip install httpx
      - name: smoke test through the cluster
        run: |
          kubectl -n notify-flow port-forward svc/notify-flow-api 8000:80 &
          sleep 3
          python3 scripts/smoke_test.py --api http://localhost:8000 --expect-escalation --timeout 240
      - if: failure()
        run: |
          kubectl -n notify-flow get pods -o wide
          kubectl -n notify-flow describe pods | tail -100
          for d in api relay consumer worker; do kubectl -n notify-flow logs deploy/notify-flow-$d --tail=60 || true; done
