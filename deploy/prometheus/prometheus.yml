global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: notify-flow
    static_configs:
      - targets: ["api:8000"]
        labels: {component: api}
      - targets: ["relay:9101"]
        labels: {component: relay}
      - targets: ["consumer:9101"]
        labels: {component: consumer}
      - targets: ["worker:9101"]
        labels: {component: worker}
