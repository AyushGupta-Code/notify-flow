# Generated by scripts/drill_to_promtool.py from drill run da50db
# (LLM killed at 60.0s, restored at 240.0s; points every 10s).
rule_files: [alerts.yml]
evaluation_interval: 10s
tests:
  - name: replay of LLM-outage drill da50db
    interval: 10s
    input_series:
      - series: 'nf_copy_generated_total{source="llm",reason="ok"}'
        values: '0 38 77 152 232 307 385 385 385 385 385 385 385 385 385 385 385 385 385 385 385 385 385 385 385 461 522 600 677 756 833 911 988'
      - series: 'nf_copy_generated_total{source="template",reason="circuit_open"}'
        values: '0 0 0 0 0 0 0 78 158 235 313 391 469 545 624 701 778 857 933 1012 1089 1167 1245 1321 1400 1400 1400 1400 1400 1400 1400 1400 1400'
      - series: 'nf_llm_circuit_state{instance="worker-1"}'
        values: '0 0 0 0 0 0 0 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 0 0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 50s
        alertname: NotifyFlowLLMCircuitOpen
        exp_alerts: []
      - eval_time: 210s
        alertname: NotifyFlowLLMCircuitOpen
        exp_alerts:
          - exp_labels: {severity: warning, team: proactive-comms}
            exp_annotations:
              summary: "LLM circuit breaker is open (or half-open) on at least one worker"
              runbook: "docs/RUNBOOK.md#llm-circuit-open"
      # Finding from the drill: a 3-minute outage never satisfies the fallback-rate alert's
      # 'for: 5m', so the circuit alert is the one that catches short provider outages.
      - eval_time: 230s
        alertname: NotifyFlowLLMFallbackRateHigh
        exp_alerts: []
