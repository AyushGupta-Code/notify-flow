apiVersion: batch/v1
kind: Job
metadata:
  name: notify-flow-migrate
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: migrate
          image: notify-flow:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: notify-flow-config}
            - secretRef: {name: notify-flow-secrets}
