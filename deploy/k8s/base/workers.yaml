apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify-flow-relay
spec:
  replicas: 1
  selector:
    matchLabels: {app: notify-flow-relay}
  template:
    metadata:
      labels: {app: notify-flow-relay}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9101"}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      terminationGracePeriodSeconds: 30
      containers:
        - name: relay
          image: notify-flow:latest
          command: ["python", "-m", "notify_flow.relay_main"]
          ports: [{name: metrics, containerPort: 9101}]
          envFrom:
            - configMapRef: {name: notify-flow-config}
            - secretRef: {name: notify-flow-secrets}
          livenessProbe:
            tcpSocket: {port: metrics}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
