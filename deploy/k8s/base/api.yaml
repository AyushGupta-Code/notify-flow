apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify-flow-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: notify-flow-api}
  template:
    metadata:
      labels: {app: notify-flow-api}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: api
          image: notify-flow:latest
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: notify-flow-config}
            - secretRef: {name: notify-flow-secrets}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: notify-flow-api
spec:
  selector: {app: notify-flow-api}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notify-flow-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: notify-flow-api}
